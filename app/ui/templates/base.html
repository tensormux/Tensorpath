<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NeevPath{% endblock %}</title>
  <style>
    :root {
      --fg: #1a1a1a;
      --fg-muted: #5a5a5a;
      --bg: #fafafa;
      --bg-card: #ffffff;
      --border: #e3e3e3;
      --accent: #1a4fcc;
      --accent-soft: #eef3ff;
      --good: #1d7a3a;
      --warn: #b85c00;
      --measured: #1d7a3a;
      --estimated: #b85c00;
      --imported: #5a5a5a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.5;
    }
    header {
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    header .inner {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
    }
    header h1 a { color: inherit; text-decoration: none; }
    header .tagline {
      color: var(--fg-muted);
      font-size: 13px;
    }
    header nav {
      margin-left: auto;
      display: flex;
      gap: 16px;
      font-size: 14px;
    }
    header nav a {
      color: var(--accent);
      text-decoration: none;
    }
    header nav a:hover { text-decoration: underline; }
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h2 {
      font-size: 15px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--fg-muted);
      margin: 0 0 12px;
    }
    .card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .card.recommended {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    .card-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 18px;
      font-weight: 600;
    }
    .badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: 3px;
      font-weight: 500;
    }
    .badge-recommended { background: var(--accent); color: white; }
    .badge-source-measured { background: #e6f2ea; color: var(--measured); }
    .badge-source-estimated { background: #fbeede; color: var(--estimated); }
    .badge-source-imported { background: #ececec; color: var(--imported); }
    .badge-warn { background: #fbeede; color: var(--warn); }
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-top: 8px;
    }
    .stat-label {
      font-size: 11px;
      color: var(--fg-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .stat-value {
      font-size: 18px;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    form .row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 16px;
    }
    form label {
      display: flex;
      flex-direction: column;
      font-size: 13px;
      color: var(--fg-muted);
      gap: 4px;
    }
    form select, form input[type="number"], form input[type="text"] {
      padding: 8px 10px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: white;
      color: var(--fg);
    }
    form select:focus, form input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
      border-color: var(--accent);
    }
    button {
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button:hover { filter: brightness(1.1); }
    .secondary {
      background: white;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
    pre {
      background: #1a1a1a;
      color: #e3e3e3;
      padding: 16px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
      line-height: 1.4;
    }
    .summary {
      background: var(--accent-soft);
      border-left: 3px solid var(--accent);
      padding: 14px 16px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 24px;
      color: var(--fg);
    }
    .alt-row {
      display: grid;
      grid-template-columns: 30px 1fr auto;
      gap: 16px;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      align-items: center;
    }
    .alt-row:last-child { border-bottom: none; }
    .alt-rank {
      font-weight: 600;
      color: var(--fg-muted);
    }
    .alt-name { font-weight: 500; }
    .alt-meta {
      font-size: 13px;
      color: var(--fg-muted);
      margin-top: 2px;
      font-variant-numeric: tabular-nums;
    }
    .error {
      background: #fdecec;
      border-left: 3px solid #c33;
      padding: 12px 16px;
      border-radius: 0 4px 4px 0;
      margin-bottom: 16px;
      color: #831515;
    }
    details { margin-top: 8px; }
    summary {
      cursor: pointer;
      font-size: 13px;
      color: var(--accent);
      user-select: none;
    }
    .scores {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--fg-muted);
      margin-top: 12px;
    }
    .score-chip {
      background: #f1f1f1;
      padding: 3px 8px;
      border-radius: 3px;
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <header>
    <div class="inner">
      <h1><a href="/">NeevPath</a></h1>
      <span class="tagline">Inference optimization for NeevCloud</span>
      <nav>
        <a href="/">Recommend</a>
        <a href="/compare">Compare</a>
      </nav>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
